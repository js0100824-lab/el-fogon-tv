<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogón TV</title>
<link rel="icon" id="fav" type="image/png" href="logo-llama.png">
<link rel="apple-touch-icon" href="logo-llama.png">
<style>
:root{--bg:#111;--bg2:#000;--card:#1a1a1a;--tx:#f2f2f2;--mu:#999;--ac:#e11d1d;--bd:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif;line-height:1.5}
a{color:inherit}
header{background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;max-width:1100px;margin:auto}
.brandw{display:flex;align-items:center;gap:10px}
.brandw img{height:50px;object-fit:contain}
.brandw b{font-size:22px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.top i{width:44px}
#burger{background:none;border:0;width:44px;height:44px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:8px}
#burger span{display:block;height:3px;background:#fff;border-radius:2px}
.dov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.dov.on{opacity:1;pointer-events:auto}
#drawer,.dov{bottom:auto;height:100vh;height:100dvh}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,340px);background:#000;z-index:61;transform:translateX(-100%);transition:.25s;padding:20px 26px;overflow:auto}
#drawer.on{transform:none}
#drawer .dx{position:absolute;right:0;top:0;background:#333;color:#fff;border:0;width:44px;height:44px;font-size:20px;cursor:pointer}
#drawer .dl{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px 0 18px}
#drawer .dl img{height:56px}
#drawer .dl b{font-size:22px;text-transform:uppercase;letter-spacing:1px}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #333;color:#fff;font:700 18px inherit;font-family:inherit;padding:18px 0;cursor:pointer;text-transform:uppercase}
#nav button.on{color:var(--ac)}
#nav button.adm{margin-top:26px;border:1px solid var(--ac);border-radius:8px;text-align:center;color:var(--ac);padding:12px}
.rl{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;margin:10px 0 26px}
.rl img{height:90px;max-width:45%;object-fit:contain}
.soc{justify-content:center}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h2.sec{background:var(--bg2);padding:14px 18px;margin:0 0 18px;font-size:22px;text-transform:uppercase}
.player{position:relative;background:#000;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--bd)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#222}
.card .b{padding:12px 14px}
.card h3{margin:0 0 6px;font-size:18px;line-height:1.25}
.meta{font-size:13px;color:var(--mu)}.meta em{color:var(--ac);font-style:normal;font-weight:700;text-transform:uppercase}
/* ===== Tema azul (marino suave) ===== */
html.th-azul{--bg:#0a1226;--bg2:rgba(6,10,24,.96);--card:#131f3d;--mu:#9fb0d4;--bd:rgba(140,170,230,.18);--ac:#3b82f6}
html.th-azul body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#101c3a 0%,#0a1226 60%,#070d1c 100%)}
html.th-azul #drawer{background:#070d1c}
html.th-azul #drawer .dx,html.th-azul .x{background:#1e2d55}
html.th-azul #nav button{border-bottom-color:rgba(140,170,230,.18)}
html.th-azul input,html.th-azul textarea,html.th-azul select{background:#0b1328;border-color:#2a3a66}
html.th-azul .note{background:#0b1328}
html.th-azul .btn.g{background:#25365f}
html.th-azul .box{background:#101a33}
html.th-azul .ddm,html.th-azul .fl select{background:#101a33;border-color:#2a3a66}
html.th-azul .ddm button:hover,html.th-azul .soc a:hover{background:#1e2d55}
html.th-azul .card.hero{background:linear-gradient(135deg,#16264d,#0a1226)}
html.th-azul .hero .ho{background:linear-gradient(transparent,rgba(5,9,22,.92))}
html.th-azul .modal{background:rgba(3,6,16,.82)}
html.th-azul .dlg{background:rgba(3,6,16,.74)}
html.th-azul .spn{border-color:#2a3a66;border-top-color:var(--ac)}
html.th-azul input:focus,html.th-azul textarea:focus,html.th-azul select:focus{box-shadow:0 0 0 3px rgba(59,130,246,.3)}
@media (hover:hover){html.th-azul .card:hover{border-color:rgba(59,130,246,.7)}html.th-azul .soc a:hover{box-shadow:0 10px 22px rgba(59,130,246,.25)}}
.thos{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.thb{flex:1;min-width:140px;border:2px solid #333;border-radius:10px;background:none;color:#fff;padding:0;cursor:pointer;overflow:hidden;font:700 14px inherit;font-family:inherit;text-align:center}
.thb i{display:block;height:64px}.thb span{display:block;padding:10px}
.thb.on{border-color:var(--ac)}
.card.hero{position:relative;display:flex;min-width:0;max-width:100%;min-height:clamp(260px,56.25vw,480px);margin-bottom:18px;background:linear-gradient(135deg,#2a0a0a,#111)}
.card.hero img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
.hero .ho{position:relative;margin-top:auto;width:100%;min-width:0;padding:80px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.hero .tag{display:inline-block;background:var(--ac);color:#fff;font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;padding:6px 12px;border-radius:3px;margin-bottom:10px}
.hero h3{overflow-wrap:anywhere;margin:0 0 8px;font-size:clamp(20px,3.4vw,32px);line-height:1.2;color:#fff}
.hero .meta{color:#ddd}.hero .meta em{color:#fff}
.soc{display:flex;flex-wrap:wrap;gap:12px}
.soc a{background:var(--card);border:1px solid var(--bd);padding:12px 20px;border-radius:30px;text-decoration:none;font-weight:700}
.soc a:hover{border-color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:20px 12px}
.modal.on{display:flex}
.box{background:var(--card);border-radius:10px;max-width:760px;width:100%;padding:20px;position:relative}
.box img.cv{width:100%;border-radius:8px;margin:10px 0}
.x{position:absolute;right:10px;top:10px;background:#333;color:#fff;border:0;width:34px;height:34px;font-size:18px;cursor:pointer;border-radius:4px}
input,textarea,select{width:100%;background:#0c0c0c;color:var(--tx);border:1px solid #333;border-radius:6px;padding:10px;font:inherit;margin:4px 0 12px}
textarea{min-height:160px}
label{font-size:14px;font-weight:700;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.g{background:#333}.btn.s{padding:6px 12px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0}
.note{font-size:13px;color:var(--mu);background:#0c0c0c;padding:10px;border-radius:6px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}
footer a{cursor:pointer;text-decoration:underline}
.hid{display:none}
.row span:last-child{white-space:nowrap;flex-shrink:0}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:10px;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-size:13px;font-family:inherit;text-transform:uppercase;letter-spacing:.6px;cursor:pointer}
.ddm{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:210px;max-height:300px;overflow:auto;background:#1a1a1a;border:1px solid #333;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.65);padding:6px;z-index:15}
.ddm.on{display:block}
.ddm button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 12px;border-radius:8px;font-weight:700;font-size:13px;font-family:inherit;text-transform:uppercase;letter-spacing:.4px;cursor:pointer}
.ddm button:hover{background:#2a2a2a}
.ddm button.on{background:var(--ac)}
.fl select{width:auto;max-width:55%;margin:0;background:#1a1a1a;font-weight:700;font-size:14px;text-transform:uppercase;padding:8px 10px;cursor:pointer}
body.nt .brandw b,body.nt #drawer .dl b{display:none}
body.nt .brandw img{height:60px}
body.nt #drawer .dl img{height:80px}
.wm{position:absolute;top:9%;right:2.5%;width:11%;max-width:110px;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.pz{border:1px dashed #444;border-radius:6px;padding:14px;text-align:center;color:var(--mu);font-size:13px;margin:4px 0 12px}
.pz:empty:before{content:attr(data-ph)}
.pz:focus{border-color:var(--ac);outline:0}
.pz{min-height:46px;cursor:text}
#ads{max-width:1100px;margin:0 auto 24px;padding:0 16px;overflow-anchor:none}
.adw{display:flex;align-items:center;justify-content:center;overflow:hidden;contain:layout paint}
#ads img{width:auto;max-width:100%;height:auto;max-height:170px;margin:0 auto;border-radius:8px;display:block}
.adl{font-size:11px;color:var(--mu);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.lst{max-height:100px;overflow-y:auto;border:1px solid var(--bd);border-radius:6px;padding:0 10px}
/* ===== ANIMACIONES FLUIDAS ===== */
:root{--e:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth}
/* entrada de la página */
header{animation:hdrIn .8s var(--e) both;transition:box-shadow .35s ease}
header.sc{box-shadow:0 10px 28px rgba(0,0,0,.65)}
.brandw{animation:brandIn .9s .12s var(--e) both}
@keyframes hdrIn{from{transform:translateY(-100%);opacity:0}}
@keyframes brandIn{from{opacity:0;transform:translateY(-10px) scale(.92)}}
/* botón de menú */
#burger{transition:transform .25s var(--e)}
#burger span{transform-origin:left center;transition:transform .35s var(--e)}
#burger:active{transform:scale(.9)}
/* menú lateral */
.dov{transition:opacity .4s ease;will-change:opacity}
#drawer{transition:transform .5s var(--e);will-change:transform}
#drawer .dl{opacity:0;transform:translateY(-12px);transition:opacity .5s var(--e),transform .5s var(--e)}
#drawer.on .dl{opacity:1;transform:none;transition-delay:.15s}
#drawer .dx{transition:background-color .25s ease}
#drawer .dx:active{background:var(--ac)}
#nav button{opacity:0;transform:translateX(-22px);transition:opacity .5s var(--e),transform .5s var(--e),color .25s ease,padding .3s var(--e),background-color .25s ease}
#drawer.on #nav button{opacity:1;transform:none;transition-delay:calc(.14s + var(--i,0)*.06s),calc(.14s + var(--i,0)*.06s),0s,0s,0s}
#nav button:nth-child(2){--i:1}
#nav button:nth-child(3){--i:2}
#nav button:nth-child(4){--i:3}
#nav button:nth-child(5){--i:4}
/* tarjetas de noticias */
.card{transition:transform .45s var(--e),box-shadow .45s var(--e),border-color .35s ease}
.card img{transition:transform .9s var(--e)}
@media (hover:hover){
  .card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.6);border-color:rgba(225,29,29,.6)}
  .card:hover img{transform:scale(1.06)}
}
.card:active{transform:scale(.985)}
/* botones, redes, campos */
.btn,.ddb{transition:transform .25s var(--e),filter .25s ease,background-color .25s ease}
.btn:active,.ddb:active{transform:scale(.95)}
.soc a{transition:transform .35s var(--e),border-color .3s ease,background-color .3s ease,box-shadow .35s ease}
.soc a:active{transform:scale(.96)}
input,textarea,select{transition:border-color .25s ease,box-shadow .25s ease}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(225,29,29,.22)}
/* desplegable de categorías */
.ddb svg{transition:transform .4s var(--e)}
.dd:has(.ddm.on) .ddb svg{transform:rotate(180deg)}
.ddm{display:block;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:opacity .25s ease,transform .35s var(--e),visibility 0s .35s}
.ddm.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .25s ease,transform .35s var(--e),visibility 0s}
.ddm button{transition:background-color .2s ease,transform .25s var(--e)}
/* ventana emergente (noticia / admin) */
.modal.on{animation:mIn .3s ease both}
.modal.on .box{animation:bIn .5s var(--e) both}
.modal.out{animation:mOut .22s ease both;pointer-events:none}
.modal.out .box{animation:bOut .22s ease both}
@keyframes mIn{from{opacity:0}}
@keyframes mOut{to{opacity:0}}
@keyframes bIn{from{opacity:0;transform:translateY(34px) scale(.96)}}
@keyframes bOut{to{opacity:0;transform:translateY(18px) scale(.97)}}
.x{transition:transform .35s var(--e),background-color .25s ease}
.x:active{background:var(--ac)}
/* aparición suave al hacer scroll (la activa el JS) */
.rv.rv{opacity:0;transform:translateY(20px);transition:opacity .65s var(--e),transform .65s var(--e);transition-delay:calc(var(--i,0)*75ms)}
.rv.in{opacity:1;transform:none}
#ads a{display:block;-webkit-tap-highlight-color:transparent}
#ads a:active img{transform:scale(.99)}
#ads img{transition:transform .3s var(--e)}
/* publicidad: entra con fundido */
#ads img{animation:adIn .9s var(--e) both}
@keyframes adIn{from{opacity:0;transform:scale(1.02)}}
 /* efectos hover: solo con mouse (en táctil se quedaban pegados) */
@media (hover:hover) and (pointer:fine){
  #burger:hover span:nth-child(2){transform:scaleX(.65)}
  #burger:hover span:nth-child(3){transform:scaleX(.82)}
  #drawer .dx:hover,.x:hover{background:var(--ac)}
  .x:hover{transform:rotate(90deg)}
  #nav button:not(.adm):hover{padding-left:12px;color:var(--ac)}
  #nav button.adm:hover{background:var(--ac);color:#fff}
  .btn:hover,.ddb:hover{filter:brightness(1.15)}
  .soc a:hover{transform:translateY(-3px);background:#222;box-shadow:0 10px 22px rgba(225,29,29,.18)}
  .ddm button:hover{transform:translateX(4px)}
}
/* que los títulos, el logo y los botones no se "seleccionen" al tocar */
header,h2.sec,#drawer,.card,.soc a,.rl,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
h2.sec,button{touch-action:manipulation}
/* ventana de confirmación / aviso propia de la página */
.dlg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);animation:mIn .25s ease both}
.dlg .dbox{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:380px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:bIn .4s var(--e) both}
.dlg h3{margin:0 0 8px;font-size:20px}
.dlg p{margin:0 0 22px;color:var(--mu);line-height:1.45}
.dlg .da{display:flex;gap:10px}
.dlg .da .btn{flex:1;padding:12px 16px;font-size:15px}
.dlg.out{animation:mOut .2s ease both;pointer-events:none}
.dlg.out .dbox{animation:bOut .2s ease both}
/* indicador de carga */
.ldg{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--mu)}
.spn{width:20px;height:20px;flex-shrink:0;border:3px solid #333;border-top-color:var(--ac);border-radius:50%;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.player.ld{display:flex;align-items:center;justify-content:center}
/* panel admin: títulos, etiquetas y listas no se seleccionan al tocar */
.box.adm h2,.box.adm h3,.box.adm label,.box.adm .tabs,.box.adm .row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
/* zoom del texto de la noticia (botones solo en computadora) */
.zm{display:none}
.box h2.zt{font-size:calc(1.5rem*var(--z,1));transition:font-size .25s var(--e)}
.zb{font-size:calc(1rem*var(--z,1));transition:font-size .25s var(--e)}
@media (min-width:920px) and (hover:hover) and (pointer:fine){
  .modal.news.on .zm{display:flex}
  .zm{position:fixed;bottom:32px;left:calc(50% + 380px + 18px);z-index:2;flex-direction:column;gap:8px;animation:bIn .5s var(--e) .15s both}
  .zm button{width:34px;height:34px;border-radius:50%;background:var(--card);color:#fff;border:1px solid #3a3a3a;font-size:19px;line-height:1;padding:0;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.5);transition:background-color .25s ease,border-color .25s ease,transform .25s var(--e),opacity .25s ease}
  .zm button:hover:not(:disabled){background:var(--ac);border-color:var(--ac)}
  .zm button:active:not(:disabled){transform:scale(.92)}
  .zm button:disabled{opacity:.35;cursor:default}
}
/* con una ventana abierta, la página de atrás no se desplaza (así no salen dos barras) */
html.nsb,html.ndr{overflow:hidden}
#drawer{overscroll-behavior:contain}.dov{touch-action:none}
/* barras de desplazamiento oscuras y delgadas: solo en computadora */
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:10px;border:2px solid transparent;background-clip:content-box;transition:background-color .25s ease}
  ::-webkit-scrollbar-thumb:hover{background:var(--ac);background-clip:content-box}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-corner{background:transparent}
  @supports not selector(::-webkit-scrollbar){
    *{scrollbar-width:thin;scrollbar-color:#2e2e2e transparent}
  }
}
/* respeta a quien desactiva las animaciones en su dispositivo */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .spn{animation:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <button id="burger" aria-label="Menú"><span></span><span></span><span></span></button>
    <div class="brandw"><img class="lg" src="logo-llama.png" alt=""><b>Fogón TV</b></div>

  </div>
</header>
<div class="dov" id="dov"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const FB={apiKey:"AIzaSyDBJok5SCTrN7Bdc4Q8lTjIIr5dYnqePdU",authDomain:"caliente-tv-12e2c.firebaseapp.com",projectId:"caliente-tv-12e2c",appId:"1:102021074708:web:05ba27805c99ada544fc01"};

const ON=!!FB.apiKey;
let db,auth;
const SOC={youtube:"YouTube",twitch:"Twitch",tiktok:"TikTok",facebook:"Facebook",instagram:"Instagram",x:"X",whatsapp:"WhatsApp"};
let D={live:"",liveTitle:"EN VIVO",social:{},news:[]};
let view="inicio",admin=false,plKey="@",catF="";
let cfgReady=false,newsReady=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("es-DO",{year:"numeric",month:"long",day:"numeric"});

/* ---------- ANIMACIONES ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const io=!RM&&"IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  const el=e.target;io.unobserve(el);el.classList.add("in");
  const fin=ev=>{if(ev.target!==el||ev.propertyName!=="opacity")return;el.removeEventListener("transitionend",fin);el.classList.remove("rv","in");el.style.removeProperty("--i")};
  el.addEventListener("transitionend",fin);
}),{threshold:.1,rootMargin:"0px 0px -5% 0px"}):null;
function reveal(root,sel){
  if(!io||!root)return;
  root.querySelectorAll(sel).forEach((el,i)=>{el.style.setProperty("--i",i%6);el.classList.add("rv");io.observe(el)});
}
const hd=document.querySelector("header");
addEventListener("scroll",()=>hd.classList.toggle("sc",scrollY>6),{passive:true});

/* ---------- VENTANAS PROPIAS (en vez de confirm/alert del navegador) ---------- */
let dlgClose=null;
function dialog({title,msg,ok,cancel}){
  return new Promise(res=>{
    if(dlgClose)dlgClose(false);
    let closed=false;
    const d=document.createElement("div");
    d.className="dlg";d.setAttribute("role","alertdialog");d.setAttribute("aria-modal","true");
    d.innerHTML=`<div class="dbox"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="da">${cancel?`<button class="btn g" data-r="0">${esc(cancel)}</button>`:""}<button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
    const key=e=>{if(e.key==="Escape"){e.stopPropagation();done(false)}};
    const done=v=>{if(closed)return;closed=true;dlgClose=null;document.removeEventListener("keydown",key,true);d.classList.add("out");setTimeout(()=>d.remove(),200);res(v)};
    d.onclick=e=>{const b=e.target.closest("button");if(b)done(b.dataset.r==="1");else if(e.target===d)done(false)};
    dlgClose=done;document.addEventListener("keydown",key,true);
    document.body.appendChild(d);
    d.querySelector('[data-r="1"]').focus();
  });
}
const askConfirm=(title,msg,ok="Borrar")=>dialog({title,msg,ok,cancel:"Cancelar"});
const notify=msg=>dialog({title:"Aviso",msg,ok:"Entendido"});

/* ---------- ZOOM DE LA NOTICIA ---------- */
let nz=1;
function zoomUI(){$("#box").style.setProperty("--z",nz);$("#zin").disabled=nz>=1.8;$("#zout").disabled=nz<=.8}
function zoomNews(d){nz=Math.round(Math.min(1.8,Math.max(.8,nz+d))*10)/10;zoomUI()}
$("#zin").onclick=()=>zoomNews(.1);
$("#zout").onclick=()=>zoomNews(-.1);

async function load(){
  if(!ON){try{const r=await fetch("noticias.json?"+Date.now());if(r.ok)D=Object.assign(D,await r.json())}catch(e){}cfgReady=newsReady=true;render();return}
  const app=initializeApp(FB);db=getFirestore(app);auth=getAuth(app);
  onSnapshot(doc(db,"config","site"),s=>{if(s.exists())Object.assign(D,s.data());cfgReady=true;render()},()=>{cfgReady=true;render()});
  onSnapshot(collection(db,"ads"),s=>{ADS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));adIdx=0;loadAdDims().then(renderAds)});
  onSnapshot(collection(db,"news"),s=>{D.news=s.docs.map(d=>({id:d.id,...d.data()}));newsReady=true;render()},()=>{newsReady=true;render()});
  setTimeout(()=>{if(!cfgReady||!newsReady){cfgReady=newsReady=true;render()}},10000);
  onAuthStateChanged(auth,u=>{admin=!!u;render()});
  render();
}
const saveSite=()=>setDoc(doc(db,"config","site"),{live:D.live,liveTitle:D.liveTitle,social:D.social,logo:D.logo||"",logoNoText:!!D.logoNoText,wm:D.wm!==false,wmImg:D.wmImg||"",theme:D.theme==="azul"?"azul":"negro"},{merge:true});
function applyTheme(){if(!cfgReady)return;const a=D.theme==="azul";document.documentElement.classList.toggle("th-azul",a);try{localStorage.setItem("th",a?"azul":"negro")}catch(e){}}
function applyLogo(){const u=D.logo||"logo-llama.png";const fv=document.getElementById("fav");if(fv&&fv.getAttribute("href")!==u)fv.href=u;document.querySelectorAll(".lg").forEach(i=>{if(i.getAttribute("src")!==u)i.src=u});document.body.classList.toggle("nt",!!D.logoNoText&&!!D.logo)}
const fail=e=>notify("No se pudo guardar: "+(e.code||e.message));

const playerHTML=u=>rawPlayer(u).replace('class="player">','class="player">'+(D.wm!==false?`<img class="wm" src="${D.wmImg||AG}" alt="">`:''));
function rawPlayer(u){
  u=(u||"").trim();if(!cfgReady)return'<div class="player ld"><div class="ldg"><span class="spn"></span>Cargando transmisión...</div></div>';if(!u)return'<div class="empty">Transmisión no disponible por ahora.</div>';
  let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/))([\w-]{11})/))
    return`<div class="player"><iframe src="https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe></div>`;
  if(m=u.match(/youtube\.com\/channel\/([\w-]+)/))
    return`<div class="player"><iframe src="https://www.youtube.com/embed/live_stream?channel=${m[1]}&autoplay=1&mute=1" allow="autoplay;fullscreen" allowfullscreen></iframe></div>`;
  if(m=u.match(/twitch\.tv\/(\w+)/))
    return`<div class="player"><iframe src="https://player.twitch.tv/?channel=${m[1]}&parent=${location.hostname||'localhost'}&muted=true" allowfullscreen></iframe></div>`;
  if(/\.m3u8/i.test(u))return`<div class="player"><video id="hv" controls autoplay muted playsinline data-src="${esc(u)}"></video></div>`;
  return`<div class="player"><iframe src="${esc(u)}" allow="autoplay;fullscreen" allowfullscreen></iframe></div>`;
}
function startHls(){
  const v=$("#hv");if(!v)return;const s=v.dataset.src;
  if(v.canPlayType("application/vnd.apple.mpegurl"))v.src=s;
  else if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(s);h.attachMedia(v)}
}
function cards(list){
  if(!newsReady)return'<div class="empty ldg"><span class="spn"></span>Cargando noticias...</div>';if(!list.length)return'<div class="empty">Aún no hay noticias publicadas.</div>';
  return'<div class="grid">'+list.map(n=>`<div class="card" data-id="${n.id}">${n.img?`<img src="${n.img}" alt="" decoding="async">`:""}<div class="b"><h3>${esc(n.title)}</h3><div class="meta"><em>${esc(n.cat||"Noticias")}</em> — ${fmt(n.date)}</div>${admin?`<div style="margin-top:10px"><button class="btn g s" data-e="${n.id}">Editar</button> <button class="btn s" data-d="${n.id}">Borrar</button></div>`:""}</div></div>`).join("")+'</div>';
}
const heroCard=n=>`<div class="card hero" data-id="${n.id}">${n.img?`<img src="${n.img}" alt="" decoding="async">`:""}<div class="ho"><span class="tag">Último minuto</span><h3>${esc(n.title)}</h3><div class="meta"><em>${esc(n.cat||"Noticias")}</em> — ${fmt(n.date)}</div>${admin?`<div style="margin-top:10px"><button class="btn g s" data-e="${n.id}">Editar</button> <button class="btn s" data-d="${n.id}">Borrar</button></div>`:""}</div></div>`;
const catKey=c=>(c||"Noticias").trim().toLowerCase();
let ADS=[],adIdx=0;
const adDim={};
const adEl=(u,st)=>`<img src="${esc(u)}" alt="Publicidad"${st?` style="${st}"`:""}>`;
function loadAdDims(){
  return Promise.all(ADS.filter(a=>!adDim[a.img]).map(a=>new Promise(r=>{
    const i=new Image();i.onload=()=>{adDim[a.img]=[i.naturalWidth,i.naturalHeight];r()};i.onerror=r;i.src=a.img})));
}
/* alto fijo del espacio: el del anuncio más alto, así al rotar nunca cambia la altura de la página */
function adSlotH(){
  const w=(($("#ads").clientWidth||innerWidth)-32);let h=0;
  ADS.forEach(a=>{const d=adDim[a.img];h=Math.max(h,d?Math.min(170,d[1],w*d[1]/d[0]):170)});
  return Math.ceil(h||170);
}
function renderAds(){
  const el=$("#ads");if(!ADS.length){el.innerHTML="";return}
  const a=ADS[adIdx%ADS.length],im=adEl(a.img);
  el.innerHTML='<div class="adl">Publicidad</div><div class="adw" style="height:'+adSlotH()+'px">'+(a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener sponsored">${im}</a>`:im)+'</div>';
}
addEventListener("resize",()=>{const w=$("#ads .adw");if(w)w.style.height=adSlotH()+"px"});
setInterval(()=>{if(ADS.length>1){adIdx++;renderAds()}},6000);
const sorted=()=>[...D.news].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

let lastView,lastCk="",lastH=null,plLive=false;
function render(){
  applyTheme();
  const vc=view!==lastView;lastView=view;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const showP=view==="inicio"||view==="vivo";
    const key=showP?D.liveTitle+"|"+D.live+"|"+(D.wm!==false)+"|"+(D.wmImg||"").length+"|"+cfgReady:"";
  if(key!==plKey){plKey=key;$("#plw").innerHTML=showP?`<h2 class="sec">${esc(D.liveTitle||"En vivo")}</h2>${playerHTML(D.live)}`:"";startHls();
    if(showP&&(vc||(D.live&&!plLive)))reveal($("#plw"),vc?".sec,.player,.empty":".player");
    plLive=!!D.live}
  let h="";
  if(view==="inicio")h=`<h2 class="sec" style="margin-top:28px">Últimas noticias</h2>${cards(sorted().slice(0,6))}`;
  if(view==="noticias"){
    const kf=catKey,m={},cn={};
    sorted().forEach(n=>{const k=kf(n.cat);if(!m[k])m[k]=(n.cat||"Noticias").trim();cn[k]=(cn[k]||0)+1});
    if(catF&&!m[catF])catF="";
    const list=catF?sorted().filter(n=>kf(n.cat)===catF):sorted();
    const hero=newsReady&&list.length&&!catF?heroCard(list[0]):"",rest=list.slice(hero?1:0);
    const lab=catF?m[catF]:"Todas",op=(v,t)=>`<button data-cat="${esc(v)}" class="${v===catF?"on":""}">${esc(t)}</button>`;
    h=`<h2 class="sec fl"><span>Noticias</span><div class="dd"><button class="ddb" id="ddb">${esc(lab)}<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg></button><div class="ddm" id="ddm">${op("","Todas")}${Object.keys(m).sort((a,b)=>cn[b]-cn[a]||m[a].localeCompare(m[b],"es")).map(k=>op(k,m[k])).join("")}</div></div></h2>${hero}${hero&&!rest.length?"":cards(rest)}`;
  }
  if(view==="redes"){const k=Object.keys(SOC).filter(x=>D.social&&D.social[x]);
    h=`<h2 class="sec">Redes sociales</h2><div class="rl"><img src="${D.logo||'logo-llama.png'}" alt="Fogón TV" onerror="this.remove()"><img src="logo-agenda.png" alt="Agenda TV" onerror="this.remove()"></div>`+(k.length?`<div class="soc">${k.map(x=>`<a href="${esc(D.social[x])}" target="_blank" rel="noopener">${SOC[x]}</a>`).join("")}</div>`:(cfgReady?'<div class="empty">Próximamente.</div>':'<div class="empty ldg"><span class="spn"></span>Cargando...</div>'))}
  if(h!==lastH){
    lastH=h;$("#ct").innerHTML=h;applyLogo();
    const ck=view+"|"+catF+"|"+(D.news.length?1:0)+"|"+(newsReady?1:0)+(cfgReady?1:0);
    if(ck!==lastCk){lastCk=ck;reveal($("#ct"),vc?".sec,.card,.soc a,.rl img,.empty":".card,.soc a,.rl img,.empty")}
  }else applyLogo();
}
const fitDr=()=>{const h=innerHeight+"px";$("#drawer").style.height=h;$("#dov").style.height=h};
addEventListener("resize",fitDr);if(window.visualViewport)visualViewport.addEventListener("resize",fitDr);
const dr=o=>{fitDr();document.documentElement.classList.toggle("ndr",o);$("#drawer").classList.toggle("on",o);$("#dov").classList.toggle("on",o)};
$("#burger").onclick=()=>dr(true);$("#dclose").onclick=()=>dr(false);$("#dov").onclick=()=>dr(false);
$("#nav").onclick=e=>{const v=e.target.dataset.v;if(!v)return;dr(false);if(v==="admin")return openAdmin();setTimeout(()=>{view=v;render();scrollTo({top:0,left:0,behavior:"instant"})},v===view?0:220)};
document.addEventListener("click",e=>{if(!e.target.closest(".dd")){const m=$("#ddm");if(m)m.classList.remove("on")}});
$("#main").onclick=async e=>{const t=e.target;
  if(t.closest("#ddb")){$("#ddm").classList.toggle("on");return}
  const dc=t.closest("[data-cat]");if(dc){catF=dc.dataset.cat;render();const mm=$("#ddm");if(mm)mm.classList.remove("on");return}
  if(t.dataset.e)return adminPanel("noticias",t.dataset.e);
  if(t.dataset.d){const id=t.dataset.d;if(await askConfirm("Borrar noticia","Se quitará de la página y no se puede deshacer."))try{await deleteDoc(doc(db,"news",id))}catch(x){fail(x)}return}
  const c=t.closest(".card");if(c)openNews(c.dataset.id)};

let keep=false,dn=false,mt;
function modal(h,k){clearTimeout(mt);document.documentElement.classList.add("nsb");keep=!!k;$("#box").classList.toggle("adm",!!k);$("#modal").classList.remove("news");$("#box").style.removeProperty("--z");$("#modal").classList.remove("out");$("#box").innerHTML='<button class="x" id="xx">✕</button>'+h;$("#modal").classList.add("on");$("#xx").onclick=closeM}
function closeM(){if(keep)saveDraft();keep=false;const m=$("#modal");if(!m.classList.contains("on")||m.classList.contains("out"))return;m.classList.add("out");mt=setTimeout(()=>{m.classList.remove("on","out");document.documentElement.classList.remove("nsb");$("#box").innerHTML=""},220)}
$("#modal").onmousedown=e=>{dn=e.target.id==="modal"};
$("#modal").onclick=e=>{if(dn&&!keep&&e.target.id==="modal")closeM();dn=false};
function openNews(id){
  const n=D.news.find(x=>x.id===id);if(!n)return;
  modal(`<div class="meta"><em>${esc(n.cat||"Noticias")}</em> — ${fmt(n.date)}</div><h2 class="zt" style="margin:6px 30px 0 0">${esc(n.title)}</h2>${n.img?`<img class="cv" src="${n.img}" alt="">`:""}<div class="zb">${esc(n.body).split(/\n+/).map(p=>`<p>${p}</p>`).join("")}</div>`);
  nz=1;zoomUI();$("#modal").classList.add("news");
}

function openAdmin(){
  if(!ON)return modal(`<h2>Admin</h2><p class="note">Falta pegar los datos de Firebase dentro de index.html (arriba, donde dice PEGA AQUÍ).</p>`);
  if(admin)return adminPanel("vivo");
  modal(`<h2>Admin</h2><label>Correo</label><input type="email" id="em" autocomplete="username"><label>Contraseña</label><input type="password" id="pw" autocomplete="current-password"><div id="err" style="color:#f66;min-height:20px"></div><button class="btn" id="go">Entrar</button>`,true);
  const go=async()=>{try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);admin=true;adminPanel("vivo")}catch(e){$("#err").textContent="Correo o contraseña incorrectos"}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
function coverFrom(file){
  if(!file||!$("#pv"))return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    /* máxima calidad posible sin pasar el límite de la base de datos */
    let u="";
    for(const w of [1600,1400,1200,1000,800]){
      const k=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
      const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(im,0,0,c.width,c.height);
      for(const q of [.9,.82,.74,.66]){u=c.toDataURL("image/jpeg",q);if(u.length<=880000)break}
      if(u.length<=880000)break;
    }
    $("#pv").innerHTML=`<img src="${u}" style="max-width:200px;border-radius:6px">`};im.src=r.result};r.readAsDataURL(file);
}
document.addEventListener("paste",e=>{
  if(!$("#pz")||!$("#modal").classList.contains("on"))return;
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith("image/"));
  if(e.target.id==="pz")e.preventDefault();
  if(!it)return;e.preventDefault();coverFrom(it.getAsFile());
  const z=$("#pz");if(z)z.innerHTML="";
});
function adFrom(file){
  const st="max-width:100%;max-height:100px;border-radius:6px";
  const au=$("#adu");if(au)au.value="";
  const r=new FileReader();
  if(file.type==="image/gif"){r.onload=()=>{if(r.result.length>900000)return notify("El GIF pesa mucho. Súbelo a un sitio y pega su link.");$("#adp").innerHTML=adEl(r.result,st)};r.readAsDataURL(file);return}
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1000/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const u=c.toDataURL("image/jpeg",.8);if(u.length>900000)return notify("La imagen es muy pesada");
    $("#adp").innerHTML=adEl(u,st)};im.src=r.result};r.readAsDataURL(file);
}
document.addEventListener("paste",e=>{
  if(!$("#apz")||!$("#modal").classList.contains("on"))return;
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith("image/"));
  if(e.target.id==="apz")e.preventDefault();
  if(!it)return;e.preventDefault();adFrom(it.getAsFile());
  const z=$("#apz");if(z)z.innerHTML="";
});
const DR={};let curN="",curA="",noSave=false;
function saveDraft(){
  if(noSave){noSave=false;return}
  const nt=$("#nt");if(nt)DR[curN]={t:nt.value,c:$("#nc").value,b:$("#nb").value,img:$("#pv img")?$("#pv img").getAttribute("src"):""};
  const al=$("#adl");if(al)DR[curA]={l:al.value,img:$("#adp img")?$("#adp img").getAttribute("src"):""};
}
function adminPanel(t,editId){
  saveDraft();
  const tabs=[["vivo","En vivo"],["noticias","Noticias"],["redes","Redes"],["logo","Logo"],["tema","Tema"],["anuncios","Publicidad"]];
  let b="";
  if(t==="vivo")b=`<label>Título de la sección</label><input id="lt" value="${esc(D.liveTitle)}"><label>Link del directo (YouTube, Twitch o .m3u8)</label><input id="ll" value="${esc(D.live)}" placeholder="https://..."><button class="btn" id="sv">Guardar</button>`;
  if(t==="noticias"){
    let n=D.news.find(x=>x.id===editId)||{title:"",cat:"",img:"",body:""};
    curN="n:"+(editId||"");const dn=DR[curN];if(dn)n={...n,title:dn.t,cat:dn.c,body:dn.b,img:dn.img};
    b=`<h3>${editId?"Editar":"Crear"} noticia</h3><label>Título</label><input id="nt" value="${esc(n.title)}"><label>Categoría</label><input id="nc" value="${esc(n.cat)}" placeholder="Nacionales, Deportes..."><label>Portada (imagen)</label><input type="file" id="ni" accept="image/*"><div id="pz" class="pz" contenteditable="true" data-ph="Toca aquí y pega la imagen (clic derecho, Pegar)"></div><div id="pv">${n.img?`<img src="${n.img}" style="max-width:200px;border-radius:6px">`:""}</div><label>Contenido</label><textarea id="nb">${esc(n.body)}</textarea><button class="btn" id="sn">Publicar noticia</button> ${editId?'<button class="btn g" id="cn">Cancelar</button>':""}<h3 style="margin-top:26px">Noticias publicadas</h3><div class="lst">${sorted().map(x=>`<div class="row"><span>${esc(x.title)}</span><span><button class="btn g s" data-e="${x.id}">Editar</button> <button class="btn s" data-d="${x.id}">Borrar</button></span></div>`).join("")||'<div class="meta" style="padding:8px 0">Ninguna todavía.</div>'}</div>`;
  }
  const ad=t==="anuncios"&&editId?ADS.find(x=>x.id===editId):null;
  curA="a:"+(editId||"");const da=t==="anuncios"?DR[curA]:null;
  if(t==="anuncios")b=`${ad?"<h3>Editar publicidad</h3>":""}<label>Imagen o GIF</label><input type="file" id="adf" accept="image/*"><div id="apz" class="pz" contenteditable="true" data-ph="Toca aquí y pega la imagen (clic derecho, Pegar)"></div><div id="adp" style="margin-bottom:12px">${da&&da.img?adEl(da.img,"max-width:100%;max-height:100px;border-radius:6px"):ad?adEl(ad.img,"max-width:100%;max-height:100px;border-radius:6px"):""}</div><label>Link al tocar la publicidad</label><input id="adl" placeholder="https://..." value="${esc(da?da.l:(ad?ad.link:""))}"><button class="btn" id="sad">${ad?"Guardar cambios":"Agregar publicidad"}</button>${ad?' <button class="btn g" id="cna">Cancelar</button>':""}<h3 style="margin-top:26px">Publicidad publicada</h3><div class="lst" style="max-height:180px">${ADS.map(a=>`<div class="row"><span style="min-width:0;word-break:break-all">${adEl(a.img,"height:34px;border-radius:4px;vertical-align:middle")} ${a.link?"Con link":"Sin link"}</span><span><button class="btn g s" data-al="${a.id}">${a.link?"Editar link":"Poner link"}</button> <button class="btn s" data-ad="${a.id}">Borrar</button></span></div>`).join("")||'<div class="meta" style="padding:8px 0">Ninguno todavía.</div>'}</div>`;
  if(t==="redes")b=Object.keys(SOC).map(k=>`<label>${SOC[k]}</label><input data-s="${k}" value="${esc((D.social||{})[k])}" placeholder="https://...">`).join("")+`<button class="btn" id="sr">Guardar</button>`;
  if(t==="tema"){const cur=D.theme==="azul"?"azul":"negro";b=`<h3>Tema de la página</h3><div class="thos"><button class="thb ${cur==="negro"?"on":""}" data-th="negro"><i style="background:#111"></i><span>Negro</span></button><button class="thb ${cur==="azul"?"on":""}" data-th="azul"><i style="background:linear-gradient(135deg,#101c3a,#070d1c)"></i><span>Azul</span></button></div>`}
  if(t==="logo")b=`<label>Logo nuevo</label><input type="file" id="lgf" accept="image/*"><div id="lgp" style="margin:8px 0 12px;background:#000;padding:10px;border-radius:6px;text-align:center"><img src="${D.logo||"logo-llama.png"}" style="max-height:90px;max-width:100%"></div><label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px;color:var(--mu)"><input type="checkbox" id="lgn" style="width:auto;margin:0" ${D.logoNoText?"checked":""}> Mi logo ya trae el nombre (ocultar el texto "Fogón TV")</label><br><button class="btn" id="slg">Guardar logo</button> <button class="btn g" id="rlg">Volver al logo original</button><h3 style="margin-top:28px">Logo sobre el directo</h3><label>Cambiar imagen</label><input type="file" id="wmf" accept="image/*"><div id="wmp" style="margin:8px 0 12px;background:#2a5a2a;padding:10px;border-radius:6px;text-align:center"><img src="${D.wmImg||AG}" style="max-height:60px;max-width:100%"></div><label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px;color:var(--mu)"><input type="checkbox" id="wmc" style="width:auto;margin:0" ${D.wm!==false?"checked":""}> Mostrar logo de Agenda TV sobre el directo</label><br><button class="btn" id="swm">Guardar</button> <button class="btn g" id="rwm">Volver al logo de Agenda TV</button>`;
  modal(`<h2>Panel Admin</h2><div class="tabs">${tabs.map(([k,v])=>`<button class="btn ${k===t?"":"g"} s" data-t="${k}">${v}</button>`).join("")} <button class="btn g s" id="lo">Cerrar sesión</button></div>${b}`,true);
  if(ad)$("#modal").scrollTop=0;
  $("#box").onclick=async e=>{
    const el=e.target;
    try{
    if(el.dataset.t)adminPanel(el.dataset.t);
    const tb=el.closest("[data-th]");if(tb){D.theme=tb.dataset.th;applyTheme();await saveSite();adminPanel("tema")}
    if(el.dataset.e)adminPanel("noticias",el.dataset.e);
    if(el.dataset.ad&&await askConfirm("Borrar publicidad","Se quitará de la página y no se puede deshacer.")){await deleteDoc(doc(db,"ads",el.dataset.ad));adminPanel("anuncios")}
    if(el.dataset.al)adminPanel("anuncios",el.dataset.al);
    if(el.id==="cna"){delete DR["a:"+(editId||"")];noSave=true;adminPanel("anuncios")}
    if(el.id==="sad"){const pv=$("#adp img"),src=pv?pv.getAttribute("src"):"";if(!src)return notify("Elige una imagen o GIF");let lk=$("#adl").value.trim();if(lk&&!/^https?:\/\//i.test(lk))lk="https://"+lk;if(editId){const o={link:lk};if(ad&&src!==ad.img)o.img=src;await updateDoc(doc(db,"ads",editId),o)}else await addDoc(collection(db,"ads"),{img:src,link:lk,date:new Date().toISOString()});delete DR["a:"+(editId||"")];noSave=true;adminPanel("anuncios")}
    if(el.dataset.d&&await askConfirm("Borrar noticia","Se quitará de la página y no se puede deshacer.")){await deleteDoc(doc(db,"news",el.dataset.d));adminPanel("noticias")}
    if(el.id==="cn"){delete DR["n:"+(editId||"")];noSave=true;adminPanel("noticias")}
    if(el.id==="sv"){D.liveTitle=$("#lt").value;D.live=$("#ll").value.trim();await saveSite();el.textContent="¡Guardado!"}
    if(el.id==="sr"){const so={};document.querySelectorAll("[data-s]").forEach(i=>so[i.dataset.s]=i.value.trim());D.social=so;await saveSite();el.textContent="¡Guardado!"}
    if(el.id==="sn"){
      const title=$("#nt").value.trim(),body=$("#nb").value.trim();if(!title||!body)return notify("Pon título y contenido");
      const img=$("#pv img")?$("#pv img").src:"";
      if(img.length>900000)return notify("La imagen es muy pesada, usa otra más pequeña");
      const o={title,cat:$("#nc").value.trim(),body,img};
      if(editId)await updateDoc(doc(db,"news",editId),o);else await addDoc(collection(db,"news"),{...o,date:new Date().toISOString()});
      delete DR["n:"+(editId||"")];noSave=true;adminPanel("noticias");
    }
    if(el.id==="slg"){const src=$("#lgp img").src;if(src.startsWith("data:")){if(src.length>900000)return notify("El logo es muy pesado, usa uno más pequeño");D.logo=src}D.logoNoText=$("#lgn").checked;await saveSite();render();el.textContent="¡Guardado!"}
    if(el.id==="rwm"){D.wmImg="";await saveSite();render();adminPanel("logo")}
    if(el.id==="swm"){const sr=$("#wmp img").src;if(sr!==(D.wmImg||AG)){if(sr.length>900000)return notify("La imagen es muy pesada");D.wmImg=sr===AG?"":sr}D.wm=$("#wmc").checked;await saveSite();render();el.textContent="¡Guardado!"}
    if(el.id==="rlg"){D.logo="";D.logoNoText=false;await saveSite();render();adminPanel("logo")}
    if(el.id==="lo"&&await askConfirm("Cerrar sesión","Saldrás del panel de administración.","Cerrar sesión")){await signOut(auth);admin=false;closeM();render()}
    }catch(x){fail(x)}
  };
  const au=$("#adu");if(au)au.oninput=()=>{const u=au.value.trim();if(/^https?:\/\/\S+$/i.test(u))$("#adp").innerHTML=adEl(u,"max-width:100%;max-height:100px;border-radius:6px")};
  const af=$("#adf");if(af)af.onchange=()=>{if(au)au.value="";if(af.files[0])adFrom(af.files[0])};
  const apz=$("#apz");if(apz){apz.oninput=()=>{apz.innerHTML=""};apz.onkeydown=e=>{if(!(e.ctrlKey||e.metaKey))e.preventDefault()}}
  const wf=$("#wmf");if(wf)wf.onchange=()=>{
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,400/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      $("#wmp").innerHTML=`<img src="${c.toDataURL("image/png")}" style="max-height:60px;max-width:100%">`};im.src=r.result};r.readAsDataURL(wf.files[0]);
  };
  const lf=$("#lgf");if(lf)lf.onchange=()=>{
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      $("#lgp").innerHTML=`<img src="${c.toDataURL("image/png")}" style="max-height:90px;max-width:100%">`};im.src=r.result};r.readAsDataURL(lf.files[0]);
  };
  const z=$("#pz");if(z){z.oninput=()=>{z.innerHTML=""};z.onkeydown=e=>{if(!(e.ctrlKey||e.metaKey))e.preventDefault()}}
  const f=$("#ni");if(f)f.onchange=()=>coverFrom(f.files[0]);
}
load();
</script>
